<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="pw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <g transform="translate(24,24) rotate(-12) translate(-24,-24)">
    <!-- Tag body -->
    <rect x="8" y="10" width="32" height="28" rx="5" fill="url(#pw)"/>
    <!-- Tag hole -->
    <circle cx="15" cy="17" r="3" fill="#0f172a"/>
    <!-- Tag string notch -->
    <path d="M8 14 L4 10" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Dollar sign -->
    <text x="26" y="32" text-anchor="middle" fill="#0f172a" font-family="Arial,sans-serif" font-size="20" font-weight="bold">$</text>
  </g>
</svg>
